{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Resource</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f3f8ff, #dcecff);
            min-height: 100vh;
        }

        .edit-card {

            margin-top: 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
            padding: 35px;

        }

        h2 {

            color: #0d6efd;
            font-weight: bold;

        }

        .form-control {

            border-radius: 10px;

        }

        .btn {

            border-radius: 10px;

        }

        .file-box {

            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="edit-card">

                    <h2 class="text-center mb-4">
                        Edit Learning Resource
                    </h2>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            <input type="text" name="title" class="form-control" value="{{ resource.title }}" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input type="text" name="subject" class="form-control" value="{{ resource.subject }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea name="description" rows="5" class="form-control"
                                required>{{ resource.description }}</textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Reference URL
                            </label>

                            <input type="url" name="url" class="form-control" value="{{ resource.url }}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Current File
                            </label>

                            <div class="file-box">

                                {% if resource.file %}

                                <a href="{{ resource.file.url }}" target="_blank">

                                    {{ resource.file.name }}

                                </a>

                                {% else %}

                                No file uploaded

                                {% endif %}

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Upload New File

                            </label>

                            <input type="file" name="file" class="form-control">

                            <small class="text-muted">

                                Leave empty to keep the current file.

                            </small>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                                Back
                            </a>

                            <button type="submit" class="btn btn-primary px-5">

                                Update Resource

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
